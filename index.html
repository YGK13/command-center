<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>⚡ Command Center — Yuri Kruman</title>
<style>
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root{
  --bg:#000a0f; --bg-2:#030f18; --bg-3:#061520;
  --surface:rgba(255,255,255,.03); --surface-2:rgba(255,255,255,.06); --surface-3:rgba(255,255,255,.10);
  --accent:#0ea5e9; --accent-2:#38bdf8; --green:#22c55e; --orange:#f97316;
  --red:#ef4444; --purple:#a855f7; --yellow:#eab308;
  --text:#e2e8f0; --muted:#7b8fa8; --dim:#3d5068;
  --border:rgba(255,255,255,.07); --border-2:rgba(255,255,255,.13);
  --nav-h:58px; --sidebar-w:226px; --radius:10px; --radius-sm:6px; --radius-xs:4px;
  --shadow:0 4px 24px rgba(0,0,0,.45); --t:.16s ease;
  --mono:'JetBrains Mono','SFMono-Regular',Consolas,'Courier New',monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
h1,h2,h3,h4{font-weight:800;letter-spacing:-.3px}
a{color:inherit}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--dim);border-radius:4px}
input,select,textarea,button{font-family:inherit;font-size:inherit}
input:focus,select:focus,textarea:focus{outline:none}
button{cursor:pointer;border:none;background:none;color:inherit}
select option{background:#0d1a25}

/* ============================================================  SHELL  */
.shell{height:100vh;display:flex;flex-direction:column}
.layout{display:flex;flex:1;margin-top:var(--nav-h);height:calc(100vh - var(--nav-h));overflow:hidden}
.main{flex:1;overflow-y:auto;padding:22px}

/* ============================================================  NAV  */
.nav{position:fixed;top:0;left:0;right:0;height:var(--nav-h);background:var(--bg-2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 18px;z-index:200;gap:10px}
.nav-logo{font-weight:900;font-size:16px;color:var(--accent)}
.nav-title{font-weight:700;font-size:13px;color:var(--muted)}
.nav-tabs{display:flex;gap:2px;margin-left:14px}
.tab{display:flex;align-items:center;gap:6px;padding:7px 13px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;color:var(--muted);transition:background var(--t),color var(--t)}
.tab:hover{background:var(--surface-2);color:var(--text)}
.tab.active{background:rgba(14,165,233,.15);color:var(--accent)}
.tab .badge-n{display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:var(--red);color:#fff;font-size:9px;font-weight:800}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.nav-date{font-family:var(--mono);font-size:11px;color:var(--dim);white-space:nowrap}
.icon-btn{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:14px;transition:all var(--t)}
.icon-btn:hover{background:var(--surface-2);color:var(--text);border-color:var(--border-2)}
.icon-btn.danger:hover{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.3);color:var(--red)}
.stale-pill{font-family:var(--mono);font-size:10px;color:var(--orange);background:rgba(249,115,22,.1);border:1px solid rgba(249,115,22,.25);border-radius:99px;padding:3px 9px}

/* ============================================================  SIDEBAR  */
.sidebar{width:var(--sidebar-w);min-width:var(--sidebar-w);background:var(--bg-2);border-right:1px solid var(--border);overflow-y:auto;padding:12px 8px;display:flex;flex-direction:column;gap:2px}
.side-label{font-size:10px;font-weight:700;letter-spacing:.9px;color:var(--dim);padding:8px 10px 4px;text-transform:uppercase}
.side-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--radius-sm);transition:background var(--t),border-color var(--t);border:1px solid transparent;width:100%;text-align:left}
.side-item:hover{background:var(--surface-2)}
.side-item.active{background:rgba(14,165,233,.08);border-color:rgba(14,165,233,.25)}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.dot.green{background:var(--green);box-shadow:0 0 5px rgba(34,197,94,.6)}
.dot.yellow{background:var(--yellow);box-shadow:0 0 5px rgba(234,179,8,.6)}
.dot.red{background:var(--red);box-shadow:0 0 5px rgba(239,68,68,.6)}
.side-emoji{font-size:14px;width:18px;text-align:center;flex-shrink:0}
.side-name{font-size:12.5px;font-weight:500;flex:1;line-height:1.25}
.side-item.active .side-name{color:var(--accent-2)}
.side-score{font-family:var(--mono);font-size:10px;color:var(--dim)}

/* ============================================================  VIEW HEADER  */
.vhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:12px;flex-wrap:wrap}
.vtitle{font-size:21px;font-weight:900;letter-spacing:-.5px}
.vsub{font-size:12px;color:var(--muted)}
.vactions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.empty{padding:38px 20px;text-align:center;color:var(--dim);font-size:13px;background:var(--surface);border:1px dashed var(--border);border-radius:var(--radius)}

/* ============================================================  BUTTONS  */
.btn{padding:7px 14px;border-radius:var(--radius-sm);font-size:12.5px;font-weight:600;transition:all var(--t)}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{opacity:.88}
.btn-sec{background:var(--surface);border:1px solid var(--border);color:var(--muted)}.btn-sec:hover{background:var(--surface-2);color:var(--text)}
.btn-danger{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);color:var(--red)}.btn-danger:hover{background:rgba(239,68,68,.2)}
.btn-sm{padding:5px 11px;border-radius:var(--radius-xs);background:var(--surface-2);border:1px solid var(--border);color:var(--muted);font-size:11px;font-weight:600}
.btn-sm:hover{border-color:var(--accent);color:var(--accent)}

/* ============================================================  FOCUS BANNER  */
.focus{background:rgba(249,115,22,.07);border:1px solid rgba(249,115,22,.22);border-left:3px solid var(--orange);border-radius:var(--radius);padding:14px 18px;margin-bottom:18px}
.focus-h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.focus-name{font-weight:700;font-size:13px}
.focus-tag{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;padding:2px 7px;border-radius:3px;background:rgba(249,115,22,.15);color:var(--orange)}
.focus-text{font-size:13px;line-height:1.5;margin-bottom:10px}

/* ============================================================  KPI BAR  */
.kpibar{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:13px 16px}
.kpi-v{font-family:var(--mono);font-size:19px;font-weight:700;line-height:1.1}
.kpi-v.red{color:var(--red)}.kpi-v.green{color:var(--green)}.kpi-v.yellow{color:var(--yellow)}
.kpi-l{font-size:10px;font-weight:600;letter-spacing:.4px;color:var(--muted);text-transform:uppercase;margin-top:5px}

/* ============================================================  COMPANY GRID  */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:17px;position:relative;overflow:hidden;transition:border-color var(--t),background var(--t)}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--ca,var(--accent));opacity:.6}
.card:hover{background:var(--surface-2);border-color:var(--border-2)}
.card.sel{border-color:rgba(14,165,233,.4);background:rgba(14,165,233,.04)}
.card-top{display:flex;align-items:flex-start;gap:10px;margin-bottom:13px}
.card-emoji{font-size:18px}
.card-id{flex:1;min-width:0}
.card-name{font-weight:800;font-size:14px;line-height:1.2}
.card-tag{font-size:11px;color:var(--muted);margin-top:2px}
.ring{flex-shrink:0;cursor:pointer}
.rev{margin-bottom:11px}
.rev-nums{display:flex;justify-content:space-between;margin-bottom:5px}
.rev-l{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--dim)}
.rev-v{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--muted)}
.track{height:5px;background:rgba(255,255,255,.07);border-radius:99px;overflow:hidden}
.fill{height:100%;border-radius:99px;transition:width .5s ease}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:11px 0}
.chip{background:var(--bg);border-radius:var(--radius-sm);padding:6px 8px}
.chip-l{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.3px;color:var(--dim);display:block;margin-bottom:2px}
.chip-v{font-size:11px;font-weight:600}
.notes{width:100%;margin-top:6px;padding:7px 9px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--muted);font-size:11px;line-height:1.5;resize:vertical;min-height:46px;transition:border-color var(--t),color var(--t)}
.notes:focus{border-color:var(--accent);color:var(--text)}
.notes::placeholder{color:var(--dim)}
.card-foot{display:flex;gap:6px;padding-top:10px;border-top:1px solid var(--border);margin-top:8px}

/* ============================================================  KANBAN  */
.filterbar{display:flex;align-items:center;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.sel-inp{padding:6px 10px;border-radius:var(--radius-sm);background:var(--surface);border:1px solid var(--border);color:var(--text);font-size:12px}
.sel-inp:focus{border-color:var(--accent)}
.fcount{font-family:var(--mono);font-size:11px;color:var(--dim);margin-left:auto}
.kanban{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;align-items:start}
.col{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px;min-height:360px}
.col-h{display:flex;align-items:center;gap:8px;border-top:3px solid var(--cc,transparent);padding:8px 12px 10px;margin:-12px -12px 10px;border-bottom:1px solid var(--border)}
.col-l{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px}
.col-c{font-family:var(--mono);font-size:10px;color:var(--muted)}
.col-t{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--muted);margin-left:auto}
.col-b{display:flex;flex-direction:column;gap:8px}
.deal{background:var(--bg-2);border:1px solid var(--border);border-left:3px solid var(--dc,var(--accent));border-radius:var(--radius-sm);padding:10px;transition:border-color var(--t),transform var(--t)}
.deal:hover{border-color:var(--border-2);transform:translateY(-1px)}
.deal-n{font-size:12px;font-weight:600;margin-bottom:5px;line-height:1.3}
.deal-m{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.deal-co{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.deal-v{font-family:var(--mono);font-size:12px;font-weight:700;margin-left:auto}
.deal-a{font-size:10.5px;color:var(--muted);line-height:1.3;margin-bottom:4px}
.deal-d{font-family:var(--mono);font-size:10px;color:var(--dim)}
.add-col{width:100%;margin-top:8px;padding:7px;background:transparent;border:1px dashed var(--dim);border-radius:var(--radius-sm);color:var(--dim);font-size:11px}
.add-col:hover{border-color:var(--accent);color:var(--accent);background:rgba(14,165,233,.05)}

/* ============================================================  OKR  */
.okr-list{display:flex;flex-direction:column;gap:12px}
.okr{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.okr-h{display:flex;align-items:center;gap:12px;padding:14px 16px;width:100%;text-align:left;transition:background var(--t)}
.okr-h:hover{background:var(--surface-2)}
.okr-emoji{font-size:18px}
.okr-ht{flex:1;min-width:0}
.okr-cn{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);display:block;margin-bottom:2px}
.okr-ob{font-size:13.5px;font-weight:600;line-height:1.4}
.okr-pct{font-family:var(--mono);font-size:18px;font-weight:800;margin-left:auto}
.okr-pct.green{color:var(--green)}.okr-pct.yellow{color:var(--yellow)}.okr-pct.red{color:var(--red)}
.okr-chev{font-size:12px;color:var(--dim);margin-left:8px}
.okr-b{padding:14px 16px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:14px}
.kr{display:flex;align-items:center;gap:12px}
.kr-l{flex:1;font-size:12.5px;color:var(--muted)}
.kr-r{display:flex;align-items:center;gap:8px}
.kr-track{width:90px;height:5px;background:rgba(255,255,255,.06);border-radius:99px;overflow:hidden}
.kr-fill{height:100%;border-radius:99px;background:var(--accent);transition:width .5s ease}
.kr-pct{font-family:var(--mono);font-size:11px;font-weight:700;width:34px;text-align:right}
.kr-inp{width:74px;padding:4px 7px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:var(--mono);font-size:12px;text-align:right}
.kr-inp:focus{border-color:var(--accent)}
.kr-tgt{font-family:var(--mono);font-size:11px;color:var(--dim);min-width:54px}

/* ============================================================  TASKS  */
.tlist{display:flex;flex-direction:column;gap:4px}
.trow{display:flex;align-items:flex-start;gap:10px;padding:9px 12px;border-radius:var(--radius-sm);background:var(--surface);border:1px solid var(--border);border-left:2px solid var(--pc,var(--dim));transition:border-color var(--t),opacity var(--t)}
.trow:hover{border-color:var(--border-2)}
.trow.done{opacity:.4}
.tcheck{width:16px;height:16px;border-radius:4px;border:2px solid var(--dim);flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:2px;color:#fff;font-size:10px;font-weight:900}
.tcheck.on{background:var(--green);border-color:var(--green)}
.tbody{flex:1;min-width:0}
.ttitle{font-size:13px;line-height:1.4}
.trow.done .ttitle{text-decoration:line-through;color:var(--muted)}
.tmeta{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:4px}
.tco{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;padding:1px 6px;border-radius:3px;background:var(--surface-2);border:1px solid var(--border)}
.tcat{font-size:9.5px;font-weight:600;padding:1px 6px;border-radius:3px;background:var(--surface);color:var(--dim);border:1px solid var(--border);text-transform:uppercase;letter-spacing:.3px}
.tdue{font-family:var(--mono);font-size:10px;color:var(--dim)}
.badge{display:inline-flex;align-items:center;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:2px 7px;border-radius:3px}
.badge.critical{background:rgba(239,68,68,.16);color:var(--red)}
.badge.high{background:rgba(249,115,22,.16);color:var(--orange)}
.badge.medium{background:rgba(14,165,233,.14);color:var(--accent)}
.badge.low{background:rgba(123,143,168,.14);color:var(--muted)}
.tdel{width:22px;height:22px;border-radius:4px;color:var(--dim);font-size:12px;flex-shrink:0;margin-top:1px}
.tdel:hover{background:rgba(239,68,68,.12);color:var(--red)}
.addform{display:flex;flex-direction:column;gap:10px;padding:14px 16px;background:var(--surface);border:1px solid var(--border-2);border-radius:var(--radius);margin-bottom:16px}
.addrow{display:flex;gap:8px;flex-wrap:wrap}
.add-inp{flex:1;min-width:200px;padding:7px 10px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:13px}
.add-inp:focus{border-color:var(--accent)}

/* ============================================================  FEEDS  */
.feeds-toggle{display:flex;gap:8px;flex-wrap:wrap}
.ftog{padding:5px 12px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid var(--border);background:var(--surface);color:var(--muted);transition:all var(--t)}
.ftog.active{background:var(--surface-2);border-color:var(--fc,var(--accent));color:var(--text)}
.feeds-wrap{display:grid;grid-template-columns:1fr 340px;gap:18px}
.feeds-col{display:flex;flex-direction:column;gap:16px}
.fpanel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.fpanel-h{display:flex;align-items:center;gap:10px;border-top:3px solid var(--fc,transparent);padding:10px 14px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.fpanel-l{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px}
.fpanel-d{font-size:11px;color:var(--dim);flex:1}
.ftime{font-family:var(--mono);font-size:10px;color:var(--dim)}
.fitem{display:block;padding:10px 14px;border-bottom:1px solid var(--border);text-decoration:none;transition:background var(--t)}
.fitem:last-child{border-bottom:none}
.fitem:hover{background:var(--surface-2)}
.fitem-t{font-size:12.5px;font-weight:600;line-height:1.4;margin-bottom:4px}
.fitem-m{display:flex;gap:8px;align-items:center}
.fitem-s{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--dim)}
.fitem-dt{font-family:var(--mono);font-size:10px;color:var(--dim)}
.fitem-x{font-size:11px;color:var(--muted);line-height:1.4;margin-top:4px}
.digest{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;align-self:start}
.digest-h{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border)}
.digest-t{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.digest-b{padding:14px;max-height:560px;overflow-y:auto;font-size:12px;color:var(--muted);line-height:1.7}
.dg-h1{font-size:15px;font-weight:800;color:var(--text);margin:12px 0 6px}
.dg-h2{font-size:13px;font-weight:700;color:var(--text);margin:10px 0 4px}
.dg-h3{font-size:12px;font-weight:700;color:var(--muted);margin:8px 0 3px}
.dg-hr{border:none;border-top:1px solid var(--border);margin:10px 0}
.dg-li{padding-left:12px;line-height:1.6}
.dg-b{font-weight:700;color:var(--text)}
.dg-p{line-height:1.6}
.dg-sp{height:6px}

/* ============================================================  BUILD  */
.btable-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:20px}
.btable{width:100%;border-collapse:collapse}
.btable th{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--dim);padding:10px 14px;border-bottom:1px solid var(--border);text-align:left}
.btable td{padding:10px 14px;font-size:12.5px;border-bottom:1px solid var(--border)}
.btable tr:last-child td{border-bottom:none}
.btable tr:hover td{background:rgba(255,255,255,.018)}
.bmono{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.rowdim td{opacity:.55}
.sbadge{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:99px;font-size:11px;font-weight:600}
.sbadge.green{background:rgba(34,197,94,.12);color:var(--green)}
.sbadge.yellow{background:rgba(234,179,8,.14);color:var(--yellow)}
.sbadge.dim{background:rgba(123,143,168,.10);color:var(--muted)}
.archpre{font-family:var(--mono);font-size:11.5px;color:var(--muted);line-height:1.7;white-space:pre;overflow-x:auto;padding:16px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm)}

/* ============================================================  MODAL  */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;z-index:500;padding:20px;animation:fade .12s ease}
.modal{background:var(--bg-2);border:1px solid var(--border-2);border-radius:var(--radius);padding:22px;width:100%;max-width:520px;box-shadow:var(--shadow);animation:slide .14s ease;max-height:90vh;overflow-y:auto}
.modal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.modal-h h2{font-size:16px}
.mlabel{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:12px 0 5px}
.minp{width:100%;padding:8px 10px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:13px}
.minp:focus{border-color:var(--accent)}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mfoot{display:flex;gap:8px;align-items:center;margin-top:20px}

@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slide{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}

/* ============================================================  RESPONSIVE  */
@media(max-width:1100px){.grid{grid-template-columns:repeat(2,1fr)}.kanban{grid-template-columns:repeat(3,1fr)}.kpibar{grid-template-columns:repeat(2,1fr)}.feeds-wrap{grid-template-columns:1fr}}
@media(max-width:760px){.sidebar{display:none}.grid{grid-template-columns:1fr}.kanban{grid-template-columns:1fr}.nav-title{display:none}}
</style>
</head>
<body>
<div id="app"></div>

<!-- Generated data snapshot (feeds + digest + portfolio defaults). -->
<!-- Regenerated each morning by scripts/build-data.mjs. -->
<script src="data.js"></script>

<script>
/* ============================================================
   COMMAND CENTER — offline dashboard (vanilla JS, no deps)
   Reads window.__CC__ from data.js. User edits overlay the
   defaults in localStorage (versioned cc_*_v5). Works under
   file:// — opens by double-click, no server required.
   ============================================================ */
(function(){
'use strict'

// ---- Source data (with safe fallback) ------------------------
var CC = window.__CC__ || null
var hasData = !!CC

// ---- Storage (localStorage overlays) -------------------------
// When opened as the desktop app (served over http://localhost), edits
// also auto-save to disk via the server, so the morning email reads them
// with no Export step. When opened as a plain file (file://), it falls
// back to localStorage + the manual Export button — both still work.
var V='v5'
var SERVED = (location.protocol === 'http:' || location.protocol === 'https:')
var OVERLAY_KEYS = {tasks:1, deals:1, okr:1, health:1, notes:1}
function key(n){return 'cc_'+n+'_'+V}
function save(n,val){
  try{localStorage.setItem(key(n),JSON.stringify(val))}catch(e){}
  if(SERVED && OVERLAY_KEYS[n]) scheduleSync()
}
function load(n,fb){try{var r=localStorage.getItem(key(n));return r!==null?JSON.parse(r):fb}catch(e){return fb}}

// Debounced push of the full overlay to the server (desktop-app mode).
var _syncTimer=null
function scheduleSync(){ if(!SERVED) return; clearTimeout(_syncTimer); _syncTimer=setTimeout(pushState,400) }
function pushState(){
  try{
    var body=JSON.stringify({tasks:S.taskState, deals:S.deals, okr:S.okr, health:S.health, notes:S.notes, savedAt:new Date().toISOString()})
    fetch('/state',{method:'POST',headers:{'Content-Type':'application/json'},body:body}).catch(function(){})
  }catch(e){}
}

// ---- Utilities -----------------------------------------------
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function nanoid(){return Math.random().toString(36).slice(2,10)}
function fmt(v){v=Number(v)||0;if(v>=1e6)return '$'+(v/1e6).toFixed(1)+'M';if(v>=1e3)return '$'+(v/1e3).toFixed(0)+'K';return '$'+v}
function healthClass(s){return s>=70?'green':s>=50?'yellow':'red'}
function companyById(id){return (CC.companies||[]).find(function(c){return c.id===id})}
function companyShort(id){var c=companyById(id);if(!c)return id;return c.name.length>16?c.name.slice(0,14)+'…':c.name}
function companyColor(id){var c=companyById(id);return c?c.color:'#7b8fa8'}
function todayISO(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function longDate(){return new Date().toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'})}

// ---- State ---------------------------------------------------
var S={
  view: load('view','portfolio'),
  company: load('company', null),
  taskState: load('tasks', null),   // [{id,done,...added}]
  deals: load('deals', null),       // full replacement if present
  okr: load('okr', {}),             // "ci-oi-ki" -> number
  health: load('health', {}),       // id -> number
  notes: load('notes', {}),         // id -> string
  pipeFilter:'all', taskFilter:{done:'active',prio:'all',co:'all'},
  feedsOn:null, okrOpen:{}, showAddTask:false, modal:null
}

// ---- Effective (merged) data ---------------------------------
function companies(){
  return (CC.companies||[]).map(function(c){
    return Object.assign({},c,{health:(S.health[c.id]!=null?S.health[c.id]:c.health),notes:(S.notes[c.id]!=null?S.notes[c.id]:(c.notes||''))})
  })
}
function tasks(){
  var defs=CC.tasks||[]
  if(!S.taskState) return defs.slice()
  var sm={}; S.taskState.forEach(function(t){sm[t.id]=t})
  var merged=defs.map(function(t){return sm[t.id]?Object.assign({},t,{done:sm[t.id].done}):t})
  var ids={}; defs.forEach(function(t){ids[t.id]=1})
  var added=S.taskState.filter(function(t){return !ids[t.id]})
  return merged.concat(added)
}
function deals(){ return S.deals!=null ? S.deals.slice() : (CC.deals||[]).slice() }
function persistTasks(arr){ S.taskState=arr; save('tasks',arr) }
function persistDeals(arr){ S.deals=arr; save('deals',arr) }

// ---- SVG health ring -----------------------------------------
function ring(score,size){
  size=size||50;var sw=5,r=(size-sw)/2,c=2*Math.PI*r,f=(score/100)*c,cx=size/2
  var col=score>=70?'var(--green)':score>=50?'var(--yellow)':'var(--red)'
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'
    +'<circle cx="'+cx+'" cy="'+cx+'" r="'+r+'" fill="none" stroke="var(--border)" stroke-width="'+sw+'"/>'
    +'<circle cx="'+cx+'" cy="'+cx+'" r="'+r+'" fill="none" stroke="'+col+'" stroke-width="'+sw+'" stroke-linecap="round" stroke-dasharray="'+f+' '+(c-f)+'" transform="rotate(-90 '+cx+' '+cx+')"/>'
    +'<text x="'+cx+'" y="'+(cx+1)+'" text-anchor="middle" dominant-baseline="middle" font-size="'+(size*.24)+'" font-weight="700" fill="'+col+'" font-family="var(--mono)">'+score+'</text></svg>'
}

// ============================================================
//  VIEWS
// ============================================================

function vPortfolio(){
  var cos=companies()
  var sel=cos.find(function(c){return c.id===S.company})||cos[0]
  var totPipe=cos.reduce(function(s,c){return s+c.pipelineValue},0)
  var totRev=cos.reduce(function(s,c){return s+c.revenueCurrent},0)
  var crit=cos.filter(function(c){return c.health<50}).length
  var avg=Math.round(cos.reduce(function(s,c){return s+c.health},0)/cos.length)

  var focus=sel?'<div class="focus" style="border-left-color:'+sel.color+'">'
    +'<div class="focus-h"><span style="font-size:16px">'+sel.emoji+'</span><span class="focus-name">'+esc(sel.name)+'</span><span class="focus-tag">Focus Action</span></div>'
    +'<div class="focus-text">'+esc(sel.focusAction)+'</div>'
    +'<div class="vactions"><button class="btn-sm" data-act="goto" data-view="pipeline" data-co="'+sel.id+'">View Pipeline →</button>'
    +'<button class="btn-sm" data-act="goto" data-view="tasks" data-co="'+sel.id+'">View Tasks →</button></div></div>':''

  var kpi='<div class="kpibar">'
    +'<div class="kpi"><div class="kpi-v">'+fmt(totPipe)+'</div><div class="kpi-l">Total Pipeline</div></div>'
    +'<div class="kpi"><div class="kpi-v">'+fmt(totRev)+'</div><div class="kpi-l">Active Revenue</div></div>'
    +'<div class="kpi"><div class="kpi-v '+(crit?'red':'green')+'">'+crit+'</div><div class="kpi-l">Critical Cos</div></div>'
    +'<div class="kpi"><div class="kpi-v '+healthClass(avg)+'">'+avg+'</div><div class="kpi-l">Avg Health</div></div></div>'

  var cards=cos.map(function(c){
    var pct=c.revenueTarget>0?Math.min(100,Math.round(c.revenueCurrent/c.revenueTarget*100)):0
    var chips=(c.kpis||[]).map(function(k){return '<div class="chip"><span class="chip-l">'+esc(k.label)+'</span><span class="chip-v">'+esc(k.value)+'</span></div>'}).join('')
    return '<div class="card'+(sel&&sel.id===c.id?' sel':'')+'" style="--ca:'+c.color+'" data-act="select" data-co="'+c.id+'">'
      +'<div class="card-top"><div class="card-emoji">'+c.emoji+'</div>'
      +'<div class="card-id"><div class="card-name">'+esc(c.name)+'</div><div class="card-tag">'+esc(c.tagline)+'</div></div>'
      +'<div class="ring" data-act="edit-health" data-co="'+c.id+'" title="Click to edit health">'+ring(c.health,50)+'</div></div>'
      +'<div class="rev"><div class="rev-nums"><span class="rev-l">'+esc(c.revenueLabel)+'</span><span class="rev-v">'+fmt(c.revenueCurrent)+' / '+fmt(c.revenueTarget)+'</span></div>'
      +'<div class="track"><div class="fill" style="width:'+pct+'%;background:'+c.color+'"></div></div></div>'
      +'<div class="chips">'+chips+'</div>'
      +'<textarea class="notes" placeholder="Notes for this company…" data-act="note" data-co="'+c.id+'">'+esc(c.notes)+'</textarea>'
      +'<div class="card-foot"><button class="btn-sm" data-act="goto" data-view="pipeline" data-co="'+c.id+'">Pipeline ('+c.pipelineCount+')</button>'
      +'<button class="btn-sm" data-act="goto" data-view="okrs" data-co="'+c.id+'">OKRs</button></div></div>'
  }).join('')

  return '<div class="vhead"><div><div class="vtitle">Portfolio Overview</div><div class="vsub">'+cos.length+' companies · click a card to select</div></div></div>'
    +focus+kpi+'<div class="grid">'+cards+'</div>'
}

function vPipeline(){
  var ds=deals()
  var filt=S.pipeFilter==='all'?ds:ds.filter(function(d){return d.company===S.pipeFilter})
  var stages=CC.stages||[]
  var open=filt.filter(function(d){return d.stage!=='closed'})
  var closed=filt.filter(function(d){return d.stage==='closed'})
  var totOpen=open.reduce(function(s,d){return s+d.value},0)
  var totClosed=closed.reduce(function(s,d){return s+d.value},0)

  var opts='<option value="all">All Companies</option>'+(CC.companies||[]).map(function(c){return '<option value="'+c.id+'"'+(S.pipeFilter===c.id?' selected':'')+'>'+esc(c.name)+'</option>'}).join('')

  var stats='<div class="kpibar">'
    +'<div class="kpi"><div class="kpi-v">'+filt.length+'</div><div class="kpi-l">Total Deals</div></div>'
    +'<div class="kpi"><div class="kpi-v">'+fmt(totOpen)+'</div><div class="kpi-l">Open Pipeline</div></div>'
    +'<div class="kpi"><div class="kpi-v green">'+fmt(totClosed)+'</div><div class="kpi-l">Closed</div></div>'
    +'<div class="kpi"><div class="kpi-v">'+open.length+'</div><div class="kpi-l">Active Deals</div></div></div>'

  var board=stages.map(function(st){
    var col=filt.filter(function(d){return d.stage===st.key})
    var tot=col.reduce(function(s,d){return s+d.value},0)
    var cards=col.map(function(d){
      var c=companyColor(d.company)
      return '<div class="deal" style="--dc:'+c+'" data-act="edit-deal" data-id="'+d.id+'">'
        +'<div class="deal-n">'+esc(d.name)+'</div>'
        +'<div class="deal-m"><span class="deal-co" style="color:'+c+'">'+esc(companyShort(d.company))+'</span>'
        +(d.value>0?'<span class="deal-v">'+fmt(d.value)+'</span>':'')+'</div>'
        +(d.nextAction?'<div class="deal-a">'+esc(d.nextAction)+'</div>':'')
        +(d.dueDate?'<div class="deal-d">Due: '+esc(d.dueDate)+'</div>':'')+'</div>'
    }).join('')
    return '<div class="col"><div class="col-h" style="--cc:'+st.color+'"><span class="col-l">'+esc(st.label)+'</span><span class="col-c">'+col.length+'</span>'+(tot>0?'<span class="col-t">'+fmt(tot)+'</span>':'')+'</div>'
      +'<div class="col-b">'+cards+'<button class="add-col" data-act="add-deal" data-stage="'+st.key+'">+ Add</button></div></div>'
  }).join('')

  return '<div class="vhead"><div class="vtitle">Pipeline</div><div class="vactions">'
    +'<select class="sel-inp" data-act="pipe-filter">'+opts+'</select>'
    +'<button class="btn btn-primary" data-act="add-deal" data-stage="cold">+ Add Deal</button></div></div>'
    +stats+'<div class="kanban">'+board+'</div>'
}

function vOKR(){
  var prog=S.okr
  var blocks=(CC.okrs||[]).map(function(okr,oi){
    var co=companyById(okr.company); if(!co) return ''
    var ci=(CC.companies||[]).findIndex(function(c){return c.id===okr.company})
    var open=S.okrOpen[okr.company]!=null?S.okrOpen[okr.company]:(oi===0)
    var overall=okr.krs.length?Math.round(okr.krs.reduce(function(sum,kr,ki){
      var k=ci+'-'+oi+'-'+ki;var cur=prog[k]!=null?prog[k]:kr.current
      return sum+Math.min(100,Math.round(cur/Math.max(kr.target,1)*100))
    },0)/okr.krs.length):0
    var pc=overall>=70?'green':overall>=40?'yellow':'red'
    var body=open?'<div class="okr-b">'+okr.krs.map(function(kr,ki){
      var k=ci+'-'+oi+'-'+ki;var cur=prog[k]!=null?prog[k]:kr.current
      var pct=kr.target>0?Math.min(100,Math.round(cur/kr.target*100)):0
      var tgt=kr.format==='currency'?fmt(kr.target):kr.target
      return '<div class="kr"><div class="kr-l">'+esc(kr.label)+'</div><div class="kr-r">'
        +'<div class="kr-track"><div class="kr-fill" style="width:'+pct+'%"></div></div>'
        +'<span class="kr-pct">'+pct+'%</span>'
        +'<input class="kr-inp" type="number" min="0" value="'+cur+'" data-act="kr" data-k="'+k+'"/>'
        +'<span class="kr-tgt">/ '+tgt+'</span></div></div>'
    }).join('')+'</div>':''
    return '<div class="okr"><button class="okr-h" data-act="toggle-okr" data-co="'+okr.company+'">'
      +'<span class="okr-emoji">'+co.emoji+'</span><div class="okr-ht"><span class="okr-cn">'+esc(co.name)+'</span><span class="okr-ob">'+esc(okr.objective)+'</span></div>'
      +'<span class="okr-pct '+pc+'">'+overall+'%</span><span class="okr-chev">'+(open?'▾':'▸')+'</span></button>'+body+'</div>'
  }).join('')
  return '<div class="vhead"><div><div class="vtitle">OKRs — Q2 2026</div><div class="vsub">Edit any current value; saves automatically</div></div></div><div class="okr-list">'+blocks+'</div>'
}

function vTasks(){
  var all=tasks()
  var f=S.taskFilter, prRank={critical:0,high:1,medium:2,low:3}
  var vis=all.slice()
  if(f.prio!=='all')vis=vis.filter(function(t){return t.priority===f.prio})
  if(f.co!=='all')vis=vis.filter(function(t){return t.company===f.co})
  if(f.done==='active')vis=vis.filter(function(t){return !t.done})
  if(f.done==='done')vis=vis.filter(function(t){return t.done})
  vis.sort(function(a,b){var p=(prRank[a.priority]||9)-(prRank[b.priority]||9);return p!==0?p:(Number(a.done)-Number(b.done))})

  var total=all.length, done=all.filter(function(t){return t.done}).length
  var crit=all.filter(function(t){return !t.done&&t.priority==='critical'}).length

  var coOpts='<option value="">No company</option>'+(CC.companies||[]).map(function(c){return '<option value="'+c.id+'">'+esc(c.name)+'</option>'}).join('')
  var addForm=S.showAddTask?'<div class="addform">'
    +'<input class="add-inp" id="nt-title" placeholder="New task title…"/>'
    +'<div class="addrow">'
    +'<select class="sel-inp" id="nt-prio"><option value="critical">Critical</option><option value="high">High</option><option value="medium" selected>Medium</option><option value="low">Low</option></select>'
    +'<select class="sel-inp" id="nt-co">'+coOpts+'</select>'
    +'<select class="sel-inp" id="nt-cat">'+['Sales','Outreach','Content','Build','Finance','Compliance','Other'].map(function(c){return '<option'+(c==='Other'?' selected':'')+'>'+c+'</option>'}).join('')+'</select>'
    +'<input class="sel-inp" id="nt-due" type="date"/>'
    +'</div><div class="addrow"><button class="btn btn-primary" data-act="save-task">Add Task</button><button class="btn btn-sec" data-act="cancel-task">Cancel</button></div></div>':''

  var filtCo='<option value="all">All companies</option>'+(CC.companies||[]).map(function(c){return '<option value="'+c.id+'"'+(f.co===c.id?' selected':'')+'>'+esc(c.name)+'</option>'}).join('')

  var rows=vis.length?vis.map(function(t){
    var col=t.company?companyColor(t.company):'var(--dim)'
    return '<div class="trow priority-'+t.priority+''+(t.done?' done':'')+'" style="--pc:'+col+'">'
      +'<button class="tcheck'+(t.done?' on':'')+'" data-act="toggle-task" data-id="'+t.id+'">'+(t.done?'✓':'')+'</button>'
      +'<div class="tbody"><div class="ttitle">'+esc(t.title)+'</div><div class="tmeta">'
      +(t.company?'<span class="tco" style="color:'+col+'">'+esc(companyShort(t.company))+'</span>':'')
      +(t.category?'<span class="tcat">'+esc(t.category)+'</span>':'')
      +(t.dueDate?'<span class="tdue">Due: '+esc(t.dueDate)+'</span>':'')+'</div></div>'
      +'<span class="badge '+t.priority+'">'+esc(t.priority)+'</span>'
      +'<button class="tdel" data-act="del-task" data-id="'+t.id+'" title="Delete">✕</button></div>'
  }).join(''):'<div class="empty">No tasks match the current filters.</div>'

  return '<div class="vhead"><div class="vtitle">Tasks</div><div class="vactions"><span class="vsub">'+done+'/'+total+' done'+(crit?' · <span class="badge critical">'+crit+' critical</span>':'')+'</span>'
    +'<button class="btn btn-primary" data-act="toggle-addtask">'+(S.showAddTask?'− Cancel':'+ Add Task')+'</button></div></div>'
    +addForm
    +'<div class="filterbar">'
    +'<select class="sel-inp" data-act="tf-done"><option value="active"'+(f.done==='active'?' selected':'')+'>Active only</option><option value="all"'+(f.done==='all'?' selected':'')+'>All tasks</option><option value="done"'+(f.done==='done'?' selected':'')+'>Completed</option></select>'
    +'<select class="sel-inp" data-act="tf-prio"><option value="all">All priorities</option><option value="critical"'+(f.prio==='critical'?' selected':'')+'>Critical</option><option value="high"'+(f.prio==='high'?' selected':'')+'>High</option><option value="medium"'+(f.prio==='medium'?' selected':'')+'>Medium</option><option value="low"'+(f.prio==='low'?' selected':'')+'>Low</option></select>'
    +'<select class="sel-inp" data-act="tf-co">'+filtCo+'</select>'
    +'<span class="fcount">'+vis.length+' shown</span></div>'
    +'<div class="tlist">'+rows+'</div>'
}

function relTime(s){
  if(!s)return '';var d=new Date(s);if(isNaN(d))return String(s).slice(0,16)
  var m=(Date.now()-d.getTime())/60000
  if(m<60)return Math.round(m)+'m ago';if(m<1440)return Math.round(m/60)+'h ago'
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric'})
}
function renderDigest(text){
  if(!text)return '';return text.split('\n').map(function(l){
    if(l.indexOf('# ')===0)return '<div class="dg-h1">'+esc(l.slice(2))+'</div>'
    if(l.indexOf('## ')===0)return '<div class="dg-h2">'+esc(l.slice(3))+'</div>'
    if(l.indexOf('### ')===0)return '<div class="dg-h3">'+esc(l.slice(4))+'</div>'
    if(l.indexOf('---')===0||l.indexOf('===')===0)return '<hr class="dg-hr"/>'
    if(l.indexOf('- ')===0||l.indexOf('* ')===0)return '<div class="dg-li">• '+esc(l.slice(2))+'</div>'
    if(/^\d+\.\s/.test(l))return '<div class="dg-li">'+esc(l)+'</div>'
    if(l.indexOf('**')===0&&l.lastIndexOf('**')===l.length-2)return '<div class="dg-b">'+esc(l.replace(/\*\*/g,''))+'</div>'
    if(!l.trim())return '<div class="dg-sp"></div>'
    return '<div class="dg-p">'+esc(l)+'</div>'
  }).join('')
}

function vFeeds(){
  var sources=CC.feedSources||[]
  if(S.feedsOn===null)S.feedsOn=sources.map(function(s){return s.id})
  var feeds=CC.feeds||{}
  var gen=CC.generatedAt?new Date(CC.generatedAt).toLocaleString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}):'never'

  var toggles=sources.map(function(s){
    var on=S.feedsOn.indexOf(s.id)>=0
    return '<button class="ftog'+(on?' active':'')+'" style="--fc:'+s.color+'" data-act="toggle-feed" data-id="'+s.id+'">'+esc(s.label)+'</button>'
  }).join('')

  var cols=sources.filter(function(s){return S.feedsOn.indexOf(s.id)>=0}).map(function(s){
    var f=feeds[s.id]||{items:[],error:'not loaded'}
    var items=(f.items||[]).slice(0,12)
    var body=items.length?items.map(function(it){
      var open=it.link?'<a class="fitem" href="'+esc(it.link)+'" target="_blank" rel="noopener">':'<div class="fitem">'
      var close=it.link?'</a>':'</div>'
      return open
        +'<div class="fitem-t">'+esc(it.title)+'</div><div class="fitem-m">'
        +(it.source?'<span class="fitem-s">'+esc(it.source)+'</span>':'')
        +(it.pubDate?'<span class="fitem-dt">'+esc(relTime(it.pubDate))+'</span>':'')+'</div>'
        +(it.description?'<div class="fitem-x">'+esc(it.description)+'</div>':'')+close
    }).join(''):'<div class="empty" style="margin:14px">'+(f.error?'Could not load ('+esc(f.error)+'). Refreshes next morning.':'No items.')+'</div>'
    return '<div class="fpanel"><div class="fpanel-h" style="--fc:'+s.color+'"><span class="fpanel-l" style="color:'+s.color+'">'+esc(s.label)+'</span><span class="fpanel-d">'+esc(s.description)+'</span></div>'+body+'</div>'
  }).join('') || '<div class="empty">All feeds hidden. Toggle at least one above.</div>'

  var dg=CC.digest
  var digestPanel='<div class="digest"><div class="digest-h"><span class="digest-t">KB Daily Digest</span>'+(dg?'<span class="ftime">'+esc(dg.date)+'</span>':'')+'</div>'
    +'<div class="digest-b">'+(dg?renderDigest(dg.content):'<div class="empty">No digest found. Run KB ingest, then refresh.</div>')+'</div></div>'

  return '<div class="vhead"><div><div class="vtitle">Live Feeds</div><div class="vsub">Last refreshed '+esc(gen)+' · auto-updates each morning</div></div><div class="vactions feeds-toggle">'+toggles+'</div></div>'
    +'<div class="feeds-wrap"><div class="feeds-col">'+cols+'</div>'+digestPanel+'</div>'
}

function vBuilds(){
  var b=CC.builds||[]
  var discovered=b.length && b[0].name!=null
  function rel(iso,age){ if(age!=null){ if(age<=0)return 'today'; if(age===1)return 'yesterday'; if(age<30)return age+'d ago'; if(age<365)return Math.round(age/30)+'mo ago'; return Math.round(age/365)+'y ago' } return iso?esc(iso.slice(0,10)):'—' }
  var rows
  if(discovered){
    rows=b.map(function(s){
      var st=s.status==='active'?'green':s.status==='recent'?'yellow':'dim'
      var stLbl=s.status==='active'?'Active':s.status==='recent'?'Recent':'Idle'
      var gitCell=s.git?('<span class="bmono">'+esc(s.git.branch)+'</span>'+(s.git.dirty?' <span class="sbadge yellow" title="uncommitted changes">'+s.git.dirty+' uncommitted</span>':'')):'<span class="bmono" style="opacity:.5">no git</span>'
      return '<tr class="'+(s.status==='stale'?'rowdim':'')+'">'
        +'<td><div style="font-weight:600">'+esc(s.name)+(s.deploy?' <span class="sbadge green" style="font-size:9px">deploy</span>':'')+'</div>'+(s.desc?'<div style="font-size:11px;color:var(--dim);margin-top:2px">'+esc(s.desc)+'</div>':'')+'</td>'
        +'<td class="bmono">'+esc(s.type)+'</td>'
        +'<td class="bmono">'+rel(s.lastModifiedISO,s.ageDays)+'</td>'
        +'<td>'+gitCell+'</td>'
        +'<td><span class="sbadge '+st+'">'+stLbl+'</span></td></tr>'
    }).join('')
    var active=b.filter(function(s){return s.status==='active'}).length
    var dirty=b.filter(function(s){return s.git&&s.git.dirty>0}).length
    return '<div class="vhead"><div><div class="vtitle">Builds</div><div class="vsub">'+b.length+' builds discovered on disk · '+active+' active this week · '+dirty+' with uncommitted changes · live status, re-scanned on refresh</div></div></div>'
      +'<div class="btable-wrap"><table class="btable"><thead><tr><th>Build</th><th>Type</th><th>Last touched</th><th>Git</th><th>Status</th></tr></thead><tbody>'+rows+'</tbody></table></div>'
  }
  rows=b.map(function(s){
    return '<tr class="'+(s.status==='idle'?'rowdim':'')+'"><td style="font-weight:600">'+esc(s.label)+'</td>'
      +'<td class="bmono">'+s.port+'</td><td class="bmono">'+s.jobs+'</td>'
      +'<td class="bmono">'+esc(s.lastRun)+'</td><td class="bmono">'+esc(s.nextRun)+'</td>'
      +'<td><span class="sbadge '+(s.status==='active'?'green':'dim')+'">'+(s.status==='active'?'Active':'Idle')+'</span></td></tr>'
  }).join('')
  return '<div class="vhead"><div><div class="vtitle">Builds</div><div class="vsub">Static list (run the engine to auto-discover your build folders)</div></div></div>'
    +'<div class="btable-wrap"><table class="btable"><thead><tr><th>System</th><th>Port</th><th>Jobs</th><th>Last Run</th><th>Next Run</th><th>Status</th></tr></thead><tbody>'+rows+'</tbody></table></div>'
}

// ============================================================
//  MODAL (deal add/edit)
// ============================================================
function dealModal(deal,isNew){
  var stages=CC.stages||[]
  var coOpts='<option value="">— select —</option>'+(CC.companies||[]).map(function(c){return '<option value="'+c.id+'"'+(deal.company===c.id?' selected':'')+'>'+esc(c.name)+'</option>'}).join('')
  var stOpts=stages.map(function(s){return '<option value="'+s.key+'"'+(deal.stage===s.key?' selected':'')+'>'+esc(s.label)+'</option>'}).join('')
  var dueVal=(deal.dueDate&&/^\d{4}-\d{2}-\d{2}$/.test(deal.dueDate))?deal.dueDate:''
  return '<div class="overlay" data-act="close-modal"><div class="modal" data-stop="1">'
    +'<div class="modal-h"><h2>'+(isNew?'Add Deal':'Edit Deal')+'</h2><button class="icon-btn" data-act="close-modal">✕</button></div>'
    +'<label class="mlabel">Company *</label><select class="minp" id="d-co">'+coOpts+'</select>'
    +'<label class="mlabel">Deal / Contact Name *</label><input class="minp" id="d-name" value="'+esc(deal.name)+'" placeholder="e.g. Acme Corp - pilot project"/>'
    +'<div class="mrow"><div><label class="mlabel">Value ($)</label><input class="minp" id="d-val" type="number" min="0" value="'+(deal.value||0)+'"/></div>'
    +'<div><label class="mlabel">Stage</label><select class="minp" id="d-stage">'+stOpts+'</select></div></div>'
    +'<label class="mlabel">Next Action</label><input class="minp" id="d-action" value="'+esc(deal.nextAction||'')+'" placeholder="e.g. Follow up on board approval"/>'
    +'<label class="mlabel">Due Date</label><input class="minp" id="d-due" type="date" value="'+dueVal+'"/>'
    +'<div class="mfoot">'+(!isNew?'<button class="btn btn-danger" data-act="del-deal" data-id="'+deal.id+'">Delete</button>':'')
    +'<div style="flex:1"></div><button class="btn btn-sec" data-act="close-modal">Cancel</button>'
    +'<button class="btn btn-primary" data-act="save-deal" data-id="'+deal.id+'" data-new="'+(isNew?'1':'')+'">'+(isNew?'Add Deal':'Save')+'</button></div></div></div>'
}

// ============================================================
//  RENDER
// ============================================================
var VIEWS={portfolio:vPortfolio,pipeline:vPipeline,okrs:vOKR,tasks:vTasks,feeds:vFeeds,builds:vBuilds}
var TABS=[['portfolio','◈ Portfolio'],['pipeline','⚡ Pipeline'],['okrs','◎ OKRs'],['tasks','✓ Tasks'],['feeds','⊕ Feeds'],['builds','⚙ Builds']]

function render(){
  if(!hasData){
    document.getElementById('app').innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100vh;padding:30px;text-align:center"><div style="max-width:460px"><div style="font-size:40px;margin-bottom:14px">⚡</div><h1 style="font-size:20px;margin-bottom:10px">Data not generated yet</h1><p style="color:var(--muted);line-height:1.6">Open a terminal in the <b>command-center</b> folder and run <code style="background:var(--surface-2);padding:2px 7px;border-radius:4px;font-family:var(--mono)">npm run refresh</code> to generate <b>data.js</b>, then reload this page.</p></div></div>'
    return
  }
  var cos=companies()
  var critCount=tasks().filter(function(t){return !t.done&&t.priority==='critical'}).length

  var stale=''
  if(CC.generatedAt){var ageH=(Date.now()-new Date(CC.generatedAt).getTime())/3.6e6;if(ageH>30)stale='<span class="stale-pill">data '+Math.round(ageH)+'h old — run npm run refresh</span>'}

  var sidebar='<aside class="sidebar"><div class="side-label">Portfolio</div>'+cos.map(function(c){
    return '<button class="side-item'+(S.company===c.id?' active':'')+'" data-act="side" data-co="'+c.id+'"><span class="dot '+healthClass(c.health)+'"></span><span class="side-emoji">'+c.emoji+'</span><span class="side-name">'+esc(c.name)+'</span><span class="side-score">'+c.health+'</span></button>'
  }).join('')+'</aside>'

  var tabs=TABS.map(function(t){
    return '<button class="tab'+(S.view===t[0]?' active':'')+'" data-act="tab" data-view="'+t[0]+'">'+t[1]+(t[0]==='tasks'&&critCount?'<span class="badge-n">'+critCount+'</span>':'')+'</button>'
  }).join('')

  var nav='<nav class="nav"><span class="nav-logo">⚡</span><span class="nav-title">Command Center</span><div class="nav-tabs">'+tabs+'</div>'
    +'<div class="nav-right">'+stale+'<span class="nav-date">'+longDate()+'</span>'
    +(SERVED?'<button class="icon-btn" data-act="refresh" title="Refresh live feeds + business activity now">↻</button>':'')
    +'<button class="icon-btn" data-act="export" title="Save edits for the next morning email (downloads a file the engine reads)">↓</button>'
    +'<button class="icon-btn" data-act="import" title="Import JSON backup">↑</button>'
    +'<button class="icon-btn danger" data-act="reset" title="Reset edits to defaults">↺</button></div></nav>'

  var view=(VIEWS[S.view]||vPortfolio)()
  document.getElementById('app').innerHTML='<div class="shell">'+nav+'<div class="layout">'+sidebar+'<main class="main">'+view+'</main></div></div>'+(S.modal||'')
}

// ============================================================
//  EVENTS (delegation)
// ============================================================
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]'); if(!t)return
  var a=t.getAttribute('data-act')
  switch(a){
    case 'tab': S.view=t.getAttribute('data-view'); save('view',S.view); render(); break
    case 'side': S.company=t.getAttribute('data-co'); save('company',S.company); render(); break
    case 'select': S.company=t.getAttribute('data-co'); save('company',S.company); render(); break
    case 'goto': S.view=t.getAttribute('data-view'); S.company=t.getAttribute('data-co'); save('view',S.view); save('company',S.company); render(); break
    case 'edit-health': editHealth(t.getAttribute('data-co')); break
    case 'toggle-okr': toggleOKR(t.getAttribute('data-co')); break
    case 'toggle-task': toggleTask(t.getAttribute('data-id')); break
    case 'del-task': delTask(t.getAttribute('data-id')); break
    case 'toggle-addtask': S.showAddTask=!S.showAddTask; render(); break
    case 'save-task': saveNewTask(); break
    case 'cancel-task': S.showAddTask=false; render(); break
    case 'toggle-feed': toggleFeed(t.getAttribute('data-id')); break
    case 'add-deal': openDeal(null,t.getAttribute('data-stage')); break
    case 'edit-deal': openDeal(t.getAttribute('data-id')); break
    case 'save-deal': saveDeal(t.getAttribute('data-id'),t.getAttribute('data-new')==='1'); break
    case 'del-deal': removeDeal(t.getAttribute('data-id')); break
    case 'close-modal': S.modal=null; render(); break
    case 'export': doExport(); break
    case 'import': doImport(); break
    case 'reset': doReset(); break
    case 'refresh': refreshNow(t); break
  }
})

// Pull live feeds + business activity now (desktop-app mode), then reload.
function refreshNow(btn){
  if(!SERVED) return
  if(btn){ btn.textContent='⟳'; btn.disabled=true }
  fetch('/refresh',{method:'POST'}).then(function(r){return r.json()}).then(function(){
    location.reload()
  }).catch(function(){ if(btn){ btn.textContent='↻'; btn.disabled=false } alert('Could not refresh. Is the app server running?') })
}
// Keep clicks inside the modal from bubbling to the overlay (which closes it)
document.addEventListener('click',function(e){if(e.target.closest('[data-stop]'))e.stopPropagation()},true)

document.addEventListener('change',function(e){
  var t=e.target.closest('[data-act]'); if(!t)return
  var a=t.getAttribute('data-act')
  if(a==='pipe-filter'){S.pipeFilter=t.value;render()}
  else if(a==='tf-done'){S.taskFilter.done=t.value;render()}
  else if(a==='tf-prio'){S.taskFilter.prio=t.value;render()}
  else if(a==='tf-co'){S.taskFilter.co=t.value;render()}
  else if(a==='kr'){S.okr[t.getAttribute('data-k')]=Number(t.value);save('okr',S.okr)}
})
document.addEventListener('input',function(e){
  var t=e.target.closest('[data-act="note"]'); if(!t)return
  S.notes[t.getAttribute('data-co')]=t.value; save('notes',S.notes)
})

// ---- Handlers ------------------------------------------------
function toggleOKR(co){
  var idx=(CC.okrs||[]).findIndex(function(o){return o.company===co})
  var eff=S.okrOpen[co]!=null?S.okrOpen[co]:(idx===0)
  S.okrOpen[co]=!eff; render()
}
function editHealth(id){
  var c=companies().find(function(x){return x.id===id});if(!c)return
  var v=prompt('Health score for '+c.name+' (0-100):',c.health)
  if(v===null)return; v=Math.max(0,Math.min(100,Number(v)||0))
  S.health[id]=v; save('health',S.health); render()
}
function toggleTask(id){
  var arr=tasks().map(function(t){return t.id===id?Object.assign({},t,{done:!t.done}):t})
  persistTasks(arr); render()
}
function delTask(id){
  if(!confirm('Delete this task?'))return
  var arr=tasks().filter(function(t){return t.id!==id}); persistTasks(arr); render()
}
function saveNewTask(){
  var title=(document.getElementById('nt-title').value||'').trim()
  if(!title){document.getElementById('nt-title').focus();return}
  var due=document.getElementById('nt-due').value||''
  var t={id:nanoid(),title:title,priority:document.getElementById('nt-prio').value,company:document.getElementById('nt-co').value,category:document.getElementById('nt-cat').value,done:false,dueDate:due,dueISO:due}
  persistTasks(tasks().concat([t])); S.showAddTask=false; render()
}
function toggleFeed(id){
  var i=S.feedsOn.indexOf(id)
  if(i>=0)S.feedsOn.splice(i,1); else S.feedsOn.push(id)
  render()
}
function openDeal(id,stage){
  if(id){var d=deals().find(function(x){return x.id===id});if(!d)return;S.modal=dealModal(d,false)}
  else{S.modal=dealModal({id:nanoid(),company:(S.pipeFilter!=='all'?S.pipeFilter:''),name:'',value:0,stage:stage||'cold',nextAction:'',dueDate:''},true)}
  render()
}
function saveDeal(id,isNew){
  var co=document.getElementById('d-co').value
  var name=(document.getElementById('d-name').value||'').trim()
  if(!name){alert('Deal name is required.');return}
  if(!co){alert('Select a company.');return}
  var deal={id:id,company:co,name:name,value:Number(document.getElementById('d-val').value)||0,stage:document.getElementById('d-stage').value,nextAction:(document.getElementById('d-action').value||'').trim(),dueDate:document.getElementById('d-due').value||''}
  var arr=deals(); var idx=arr.findIndex(function(x){return x.id===id})
  if(idx>=0)arr[idx]=deal; else arr.push(deal)
  persistDeals(arr); S.modal=null; render()
}
function removeDeal(id){
  if(!confirm('Delete this deal?'))return
  persistDeals(deals().filter(function(x){return x.id!==id})); S.modal=null; render()
}
function doExport(){
  var data={tasks:S.taskState,deals:S.deals,okr:S.okr,health:S.health,notes:S.notes,exportedAt:new Date().toISOString()}
  var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'})
  var url=URL.createObjectURL(blob),link=document.createElement('a')
  link.href=url; link.download='command-center-'+todayISO()+'.json'; link.click(); URL.revokeObjectURL(url)
}
function doImport(){
  var inp=document.createElement('input'); inp.type='file'; inp.accept='.json'
  inp.onchange=function(e){var file=e.target.files[0];if(!file)return;var r=new FileReader()
    r.onload=function(ev){try{var d=JSON.parse(ev.target.result)
      if(d.tasks!=null){S.taskState=d.tasks;save('tasks',d.tasks)}
      if(d.deals!=null){S.deals=d.deals;save('deals',d.deals)}
      if(d.okr){S.okr=d.okr;save('okr',d.okr)}
      if(d.health){S.health=d.health;save('health',d.health)}
      if(d.notes){S.notes=d.notes;save('notes',d.notes)}
      render()
    }catch(err){alert('Invalid JSON file.')}}
    r.readAsText(file)}
  inp.click()
}
function doReset(){
  if(!confirm('Reset all your edits (tasks, deals, OKRs, health, notes) back to defaults? This cannot be undone.'))return
  ;['tasks','deals','okr','health','notes'].forEach(function(k){localStorage.removeItem(key(k))})
  S.taskState=null;S.deals=null;S.okr={};S.health={};S.notes={};render()
}

// ---- Boot ----------------------------------------------------
// In desktop-app mode, hydrate saved edits from disk (the server) before
// the first render, so the app reflects what the morning engine will read.
function boot(){
  if(SERVED){
    fetch('/state').then(function(r){return r.json()}).then(function(st){
      if(st && typeof st==='object'){
        ['tasks','deals','okr','health','notes'].forEach(function(k){
          if(st[k]!=null){ try{localStorage.setItem(key(k),JSON.stringify(st[k]))}catch(e){} }
        })
        S.taskState = st.tasks!=null ? st.tasks : S.taskState
        S.deals     = st.deals!=null ? st.deals : S.deals
        S.okr       = st.okr   || S.okr
        S.health    = st.health|| S.health
        S.notes     = st.notes || S.notes
      }
    }).catch(function(){}).finally(function(){ render(); autoRefreshOnce() })
  } else {
    render()
  }
}
// Once per app launch, pull live feeds + business activity so what you see
// is current (not last night's snapshot). sessionStorage clears when the
// app window closes, so the next launch refreshes again.
function autoRefreshOnce(){
  if(!SERVED) return
  try{ if(sessionStorage.getItem('cc_refreshed')) return; sessionStorage.setItem('cc_refreshed','1') }catch(e){}
  fetch('/refresh',{method:'POST'}).then(function(r){return r.json()}).then(function(d){
    if(d && d.ok) location.reload()
  }).catch(function(){})
}
boot()
})();
</script>
</body>
